<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — 词库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/phrase-library.css">
<link rel="stylesheet" href="../css/lang-cn.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#832118">

<body class="phrase-body" data-variant="cn">

<!-- ================================================================
     Phrase library - Chinese-only  ·  Figma node 136:1498
     Same markup/JS as phrase-library.html — see lang-cn.css — with
     its links, and js/phrase-library.js's row hrefs, pointed at the
     -cn counterpart pages instead.
     ================================================================ -->
<div class="phrasepage">

  <header class="phrasehead">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="translation-cn.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="返回翻译">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header__title">
      <span class="t-cn">词库</span>
    </h1>

    <a class="addphrasebtn" href="add-phrase-cn.html" aria-label="添加短语">
      <span class="crop addphrasebtn__icon" style="--x:6px;--y:2px;--w:53px;--h:53px">
        <img src="../assets/phrase-add-icon.png" alt=""
             style="--iw:248.667px;--ih:172.797px;--ix:-99.472px;--iy:-18.229px">
      </span>
      <span class="addphrasebtn__label">
        <span class="t-cn">添加</span>
      </span>
    </a>
  </header>

  <!-- seed phrases + anything saved from add-phrase-cn.html — js/phrase-library.js -->
  <div class="phraselist" id="phraseList"></div>

  <a class="phrasebar" href="home-cn.html">
    <img class="phrasebar__bg" src="../assets/bottomnav-bg.svg" alt="">
    <span class="crop" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
    <span class="phrasebar__text">
      <span class="t-cn">返回首页</span>
    </span>
  </a>

</div>

<script src="../js/phrase-library.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
</html>
