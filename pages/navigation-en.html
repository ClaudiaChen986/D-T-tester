<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuiTu — Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/navigation.css">
<link rel="stylesheet" href="../css/lang-en.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#832118">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="归途 GuiTu">
</head>
<body data-variant="en">

<div class="stage">
<!-- ============================================================
     Navigation - maps - English-only · 390 × 844   (Figma node 7:1284)
     Same markup/JS as navigation.html — see lang-en.css — with its
     links, and js/navigation.js's destRow href, pointed at the -en
     counterpart pages instead.
     ============================================================ -->
<div class="screen" id="screen">

  <div class="bg-texture"><img src="../assets/background-texture.png" alt=""></div>

  <div class="navmap">
    <iframe title="Map showing current location"
            src="https://maps.google.com/maps?q=Chatswood%20NSW%20Australia&z=15&output=embed"
            loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>

  <!-- ---------------------------------------------------------------- header -->
  <header class="header">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="home-en.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to home">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header__title">
      <span class="t-en">Maps&nbsp;</span><span class="t-cn">地图</span>
    </h1>

    <p class="header__welcome">
      <span class="t-en">Current location</span>
      <span class="t-cn">当前位置</span>
    </p>
  </header>

  <!-- ---------------------------------------------------------- share location -->
  <button class="navshare" id="shareLocationBtn" type="button" aria-pressed="false">
    <span class="navshare__icon">
      <img class="navshare__glyph" id="shareLocationIcon" src="../assets/icon-call-location-off.svg" alt="">
    </span>
    <span class="navshare__label">
      <span class="t-en">Location</span>
      <span class="t-cn">分享位置</span>
    </span>
  </button>

  <!-- ---------------------------------------------------------- slide up card
       Same component/geometry/drag animation as home.html's #sheet — see
       js/navigation.js, which reuses js/app.js's drag logic verbatim. -->
  <div class="sheet" id="sheet" data-state="collapsed">
    <img class="sheet__bg" src="../assets/sheet-bg.svg" alt="">

    <button class="navbtn navbtn--calls" type="button" data-action="open-contacts">
      <img class="navbtn__icon" src="../assets/icon-phone.svg" alt=""
           style="--x:15.256px;--y:11.322px;--w:34.662px;--h:35.294px">
      <span class="navbtn__label" style="--x:51px;--y:5.773px;--w:51px">
        <span class="t-en">Calls</span>
        <span class="t-cn">电话</span>
      </span>
    </button>

    <a class="navbtn navbtn--profile" href="profile-en.html">
      <img class="navbtn__icon" src="../assets/icon-profile.svg" alt=""
           style="--x:14px;--y:10.185px;--w:32px;--h:37.251px">
      <span class="navbtn__label" style="--x:50px;--y:5.773px;--w:60px">
        <span class="t-en">Profile</span>
        <span class="t-cn">个人</span>
      </span>
    </a>

    <img class="sheet__panel" src="../assets/sheet-panel.svg" alt="">

    <a class="row" style="--y:194px" href="go-home-en.html">
      <img class="row__bg" src="../assets/contact-row.svg" alt="">
      <span class="navrow__label" style="--x:34px;--y:29px">
        <span class="t-en">Go home</span>
        <span class="t-cn">回家</span>
      </span>
      <span class="chevron" style="--x:242px;--y:43px;--s:36px">
        <img src="../assets/icon-chevron.svg" alt="">
      </span>
    </a>

    <!-- Unset: "Set destination" placeholder → add-destination-en.html,
         marked by the location icon. Set (js/navigation.js,
         guitu.savedDestination): shows the saved name, →
         navigate-destination-en.html instead, and swaps the icon for
         the same chevron the "Go home" row above uses. -->
    <a class="row" id="destRow" style="--y:343px" href="add-destination-en.html">
      <img class="row__bg" src="../assets/contact-row.svg" alt="">
      <span class="navrow__label navrow__label--muted" id="destRowLabel" style="--x:28px;--y:29px">
        <span class="t-en">Set destination</span>
        <span class="t-cn">设置目的地</span>
      </span>
      <span class="crop navrow__icon" id="destRowIcon" style="--x:228px;--y:28px;--w:65px;--h:65px">
        <img src="../assets/navigation-destination-icon.png" alt=""
             style="--iw:304.967px;--ih:211.926px;--ix:-121.986px;--iy:-22.354px">
      </span>
      <span class="chevron" id="destRowChevron" style="--x:242px;--y:43px;--s:36px" hidden>
        <img src="../assets/icon-chevron.svg" alt="">
      </span>
    </a>

    <!-- Always a plain "Set destination" trigger → add-destination-en.html,
         never the display itself: only one saved-destination slot exists
         (guitu.savedDestination), and the row above is what shows it —
         saving here replaces whatever's in that row rather than filling
         this one in too. -->
    <a class="row" style="--y:492px" href="add-destination-en.html">
      <img class="row__bg" src="../assets/contact-row.svg" alt="">
      <span class="navrow__label navrow__label--muted" style="--x:28px;--y:29px">
        <span class="t-en">Set destination</span>
        <span class="t-cn">设置目的地</span>
      </span>
      <span class="crop navrow__icon" style="--x:228px;--y:28px;--w:65px;--h:65px">
        <img src="../assets/navigation-destination-icon.png" alt=""
             style="--iw:304.967px;--ih:211.926px;--ix:-121.986px;--iy:-22.354px">
      </span>
    </a>

    <button class="sheet__handle" id="sheetHandle" type="button"
            aria-controls="sheet" aria-expanded="false" aria-label="Expand navigation">
      <img src="../assets/sheet-handle-arrow.svg" alt="">
    </button>

    <span class="crop sheet__medallion" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
  </div>

</div>
</div>

<script src="../js/navigation.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
</html>
