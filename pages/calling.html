<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Calling… 正在拨打</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/calling.css">
</head>
<body>

<div class="stage">
<!-- ============================================================
     Calling… · 390 × 844   (Figma node 7:365 / 7:438)
     One template for every contact, including Emergency — see
     js/calling.js for how the target contact is read in.
     ============================================================ -->
<div class="screen screen--call" id="screen">

  <div class="bg-texture"><img src="../assets/background-texture.png" alt=""></div>

  <p class="callscreen__caption">Emergency contact</p>

  <p class="callscreen__name" id="callName">
    <span class="t-en">Daughter (Lily)</span>
    <span class="t-cn">女儿（莉莉）</span>
  </p>

  <p class="callscreen__status">
    <span class="t-en">Calling...&nbsp;</span><span class="t-cn">正在拨打</span>
  </p>

  <img class="callscreen__avatar" id="callAvatar" src="../assets/avatar.svg" alt="">

  <!-- ------------------------------------------------------------- keypad
       Decorative, like Location/Speaker below — no DTMF/typed-digits
       display wired up in this prototype. -->
  <div class="callscreen__keypad" aria-hidden="true">
    <button class="callkey" type="button" style="--x:77px;--y:479px" tabindex="-1">1</button>
    <button class="callkey" type="button" style="--x:161px;--y:479px" tabindex="-1">2</button>
    <button class="callkey" type="button" style="--x:245px;--y:479px" tabindex="-1">3</button>
    <button class="callkey" type="button" style="--x:77px;--y:554.6px" tabindex="-1">4</button>
    <button class="callkey" type="button" style="--x:161px;--y:554.6px" tabindex="-1">5</button>
    <button class="callkey" type="button" style="--x:245px;--y:554.6px" tabindex="-1">6</button>
    <button class="callkey" type="button" style="--x:77px;--y:630.2px" tabindex="-1">7</button>
    <button class="callkey" type="button" style="--x:161px;--y:630.2px" tabindex="-1">8</button>
    <button class="callkey" type="button" style="--x:245px;--y:630.2px" tabindex="-1">9</button>
    <button class="callkey" type="button" style="--x:161px;--y:705.8px" tabindex="-1">0</button>
  </div>

  <!-- -------------------------------------------------------- call panel -->
  <div class="callpanel">
    <div class="callpanel__handle" aria-hidden="true"></div>

    <div class="callbtn-group" style="--x:31px">
      <button class="callbtn" id="speakerBtn" type="button" aria-pressed="false" aria-label="Speaker 扬声器">
        <img class="callbtn__icon" id="speakerIcon" src="../assets/icon-call-speaker-off.svg" alt="">
      </button>
      <p class="callbtn-label"><span class="t-en">Speaker</span><span class="t-cn">扬声器</span></p>
    </div>

    <div class="callbtn-group" style="--x:152px">
      <button class="callbtn" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute 静音">
        <img class="callbtn__icon" id="muteIcon" src="../assets/icon-call-mute-off.svg" alt="">
      </button>
      <p class="callbtn-label"><span class="t-en">Mute</span><span class="t-cn">静音</span></p>
    </div>

    <div class="callbtn-group" style="--x:273px">
      <button class="callbtn" id="locationBtn" type="button" aria-pressed="false" aria-label="Share location 分享位置">
        <img class="callbtn__icon" id="locationIcon" src="../assets/icon-call-location-off.svg" alt="">
      </button>
      <p class="callbtn-label"><span class="t-en">Location</span><span class="t-cn">分享位置</span></p>
    </div>

    <button class="callscreen__hangup" id="hangupBtn" type="button" aria-label="Hang up 挂断">
      <img class="callscreen__hangup-bg" src="../assets/icon-field-backdrop.png" alt="">
      <img class="callscreen__hangup-icon" src="../assets/icon-call-hangup.svg" alt="">
    </button>
    <p class="callscreen__hangup-label"><span class="t-en">Hung up</span><span class="t-cn">挂断</span></p>
  </div>

</div>
</div>

<script src="../js/calling.js"></script>
</body>
</html>
