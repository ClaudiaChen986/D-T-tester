<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Adding event 添加日程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/add-event.css">
</head>
<body class="addevent-body">

<!-- ================================================================
     add task - both  ·  Figma node 19:1501
     Reached from calendar.html's Add button (or its "plan tomorrow"
     button, which arrives with ?day=1 pre-selecting tomorrow). A real
     scrolling page, not a fixed stage.

     Date, "Date and Time - Wheels", and Duration are rendered exactly as
     Figma's own mock shows them (including its literal sample values —
     Jun 5 2023, 8:00 pm, 1h) rather than as live controls — interactivity
     for those is a later pass, per instruction; see js/add-event.js for
     what Save does with them meanwhile (fixed defaults, not read from
     these elements). The round icon circle and the title field are both
     real again, by request: tapping the circle reveals a horizontal
     strip of Material Symbols (fonts.google.com/icons) to pick from, and
     title is a genuine text input, same as it's always been.
     ================================================================ -->
<div class="addeventpage">

  <header class="addeventhead">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="calendar.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Cancel, back to My Calendar 返回">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header-title-centered">
      <span class="t-en">Adding event</span>
      <span class="t-cn">添加日程</span>
    </h1>
  </header>

  <form id="eventForm" novalidate>

    <div class="addevent__teal">
      <div class="addevent__row">
        <button class="iconpicker" id="iconPicker" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose an icon 选择图标">
          <span class="iconpicker__display" id="iconDisplay">
            <span class="material-symbols-outlined iconpicker__hint" aria-hidden="true">add_photo_alternate</span>
          </span>
        </button>

        <div class="titlewrap">
          <input class="titleinput" type="text" id="titleInput" name="title" autocomplete="off"
                 aria-label="Event title 日程标题">
          <span class="titleinput__placeholder" id="titlePlaceholder" aria-hidden="true">
            <span class="t-en">Enter text here</span>
            <span class="t-cn">在此输入文本</span>
          </span>
        </div>
      </div>

      <div class="addevent__divider" aria-hidden="true"></div>

      <div class="iconbar" id="iconBar" hidden role="listbox" aria-label="Event icon 日程图标"></div>
    </div>

    <div class="addevent__fields">

      <p class="formstatus" role="status" aria-live="polite" id="formStatus"></p>

      <div class="fieldgroup">
        <p class="fieldgroup__label"><span class="t-en">Date</span> <span class="t-cn">日期</span></p>
        <div class="datepill">
          <button class="datepill__badge" id="dateButton" type="button" aria-label="Choose date 选择日期">
            <span class="material-symbols-outlined">calendar_month</span>
          </button>
          <span class="datepill__text" id="dateText"></span>
          <input class="datepill__input" type="date" id="dateInput" name="date" aria-hidden="true" tabindex="-1">
        </div>
      </div>

      <div class="fieldgroup">
        <p class="fieldgroup__label"><span class="t-en">Time</span> <span class="t-cn">时间</span></p>
        <div class="wheelcard" aria-hidden="true">
          <div class="wheelcard__selection"></div>
          <div class="wheelcol">
            <span class="wheelcol__row wheelcol__row--2">6</span>
            <span class="wheelcol__row wheelcol__row--1">7</span>
            <span class="wheelcol__row wheelcol__row--sel">8</span>
            <span class="wheelcol__row wheelcol__row--1">9</span>
            <span class="wheelcol__row wheelcol__row--2">10</span>
          </div>
          <div class="wheelcol">
            <span class="wheelcol__row wheelcol__row--2">58</span>
            <span class="wheelcol__row wheelcol__row--1">59</span>
            <span class="wheelcol__row wheelcol__row--sel">00</span>
            <span class="wheelcol__row wheelcol__row--1">01</span>
            <span class="wheelcol__row wheelcol__row--2">02</span>
          </div>
          <div class="wheelcol wheelcol--ampm">
            <span class="wheelcol__row wheelcol__row--1">AM</span>
            <span class="wheelcol__row wheelcol__row--sel">PM</span>
            <span class="wheelcol__row wheelcol__row--1">&nbsp;</span>
          </div>
        </div>
      </div>

      <div class="fieldgroup">
        <p class="fieldgroup__label"><span class="t-en">Duration</span> <span class="t-cn">时长</span></p>
        <div class="durationpill" aria-hidden="true">
          <span class="durationpill__highlight"></span>
          <span class="durationpill__select"></span>
          <span class="durationpill__value">5</span>
          <span class="durationpill__value">10</span>
          <span class="durationpill__value">15</span>
          <span class="durationpill__value">30</span>
          <span class="durationpill__value durationpill__value--selected">1h</span>
          <span class="durationpill__value">2h</span>
          <span class="durationpill__value">3h</span>
        </div>
      </div>

      <button class="save" id="saveBtn" type="submit">
        <span class="t-en">Save&nbsp;</span><span class="t-cn">保存</span>
      </button>

    </div>
  </form>

</div>

<script src="../js/add-event.js"></script>
</body>
</html>
