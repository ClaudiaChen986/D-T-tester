<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Adding event 添加日程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/add-event-continue.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#832118">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="归途 GuiTu">
</head>
<body class="addevent-body">

<!-- ================================================================
     add task （continue） - both  ·  Figma node 19:1547
     Step 2 of add-event.html's flow — reached from its Save button.
     The round shape + title/date/time here are read-only, filled in
     from whatever was entered on step 1 (sessionStorage
     `guitu.addEventDraft`, written by js/add-event.js). This step adds
     Repeat + an optional sub-task, then its own Save writes the
     finished event to localStorage and returns to calendar.html — see
     js/add-event-continue.js.
     ================================================================ -->
<div class="aecpage">

  <header class="aechead">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="add-event.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to editing 返回">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header-title-centered">
      <span class="t-en">Adding event</span>
      <span class="t-cn">添加日程</span>
    </h1>
  </header>

  <form id="continueForm">

    <div class="aec__teal">
      <div class="aec__icon" id="summaryIcon"></div>
      <div class="aec__summary">
        <p class="aec__title" id="summaryTitle"></p>
        <p class="aec__when" id="summaryWhen"></p>
      </div>
    </div>

    <div class="aec__fields">

      <div class="aec__card">
        <p class="aec__card-label"><span class="t-en">Repeat</span> <span class="t-cn">重复</span></p>
        <div class="repeatgrid" id="repeatGrid" role="radiogroup" aria-label="Repeat 重复">
          <button class="repeatchip is-selected" type="button" data-repeat="none">
            <span class="t-en">No repetition</span><span class="t-cn">不重复</span>
          </button>
          <button class="repeatchip" type="button" data-repeat="daily">
            <span class="t-en">Daily</span><span class="t-cn">每天</span>
          </button>
          <button class="repeatchip" type="button" data-repeat="weekly">
            <span class="t-en">Weekly</span><span class="t-cn">每周</span>
          </button>
          <button class="repeatchip" type="button" data-repeat="fortnightly">
            <span class="t-en">Every fortnight</span><span class="t-cn">每两周</span>
          </button>
          <button class="repeatchip" type="button" data-repeat="monthly">
            <span class="t-en">Monthly</span><span class="t-cn">每月</span>
          </button>
          <button class="repeatchip" type="button" data-repeat="yearly">
            <span class="t-en">Yearly</span><span class="t-cn">每年</span>
          </button>
        </div>
      </div>

      <div class="aec__card">
        <div class="subtaskrow">
          <button class="subtaskrow__tick" id="subtaskToggle" type="button" role="checkbox" aria-checked="false" aria-label="Add a sub-task 添加子任务">
            <span class="material-symbols-outlined">check_box_outline_blank</span>
          </button>
          <span class="subtaskrow__label" id="subtaskLabel">
            <span class="t-en">add sub-task&nbsp;</span><span class="t-cn">添加子任务</span>
          </span>
        </div>
        <textarea class="subtaskarea" id="subtaskInput" disabled
                  placeholder="Enter text here 在此输入文本" aria-label="Sub-task 子任务"></textarea>
      </div>

      <button class="save" id="saveBtn" type="submit">
        <span class="t-en">Save&nbsp;</span><span class="t-cn">保存</span>
      </button>

    </div>
  </form>

</div>

<script src="../js/notifications.js"></script>
<script src="../js/add-event-continue.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
</html>
