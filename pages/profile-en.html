<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuiTu — Your profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/profile.css">
<link rel="stylesheet" href="../css/lang-en.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#832118">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="归途 GuiTu">
</head>
<body data-variant="en">

<div class="stage">
<!-- ============================================================
     profile - English-only  ·  390 × 844   (Figma node 2:544)
     Same markup/JS as profile.html — see lang-en.css — with its
     links, and js/profile.js's Edit-button redirect, pointed at
     the -en counterpart pages instead.
     ============================================================ -->
<div class="screen" id="screen">

  <div class="bg-texture"><img src="../assets/background-texture.png" alt=""></div>

  <!-- ---------------------------------------------------------------- header -->
  <header class="header">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="home-en.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to home">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header-title-centered">
      <span class="t-en">Your profile</span>
      <span class="t-cn">您的个人资料</span>
    </h1>
  </header>

  <!-- ------------------------------------------------------------- content -->
  <div class="profileview__content"></div>

  <img class="profileview__avatar" id="avatarImg" src="../assets/avatar-xl.svg" alt="">

  <button class="profileview__edit" id="editBtn" type="button" aria-label="Edit your profile">
    <img class="profileview__edit-bg" src="../assets/edit-ellipse.svg" alt="">
    <img class="profileview__edit-icon" src="../assets/icon-edit-pencil.svg" alt="">
  </button>

  <div class="profileview__field" style="--y:332px">
    <div class="profileview__field-icon">
      <img class="backdrop" src="../assets/icon-field-backdrop.png" alt="">
      <img class="glyph" src="../assets/icon-mail.svg" alt="">
    </div>
    <p class="profileview__field-text">
      <span class="label"><span class="t-en">Email</span><span class="sp"> </span><span class="t-cn">电子邮件：</span></span>
      <span class="value" id="emailValue">User.123@example.com</span>
    </p>
  </div>

  <div class="profileview__field" style="--y:422px">
    <div class="profileview__field-icon">
      <img class="backdrop" src="../assets/icon-field-backdrop.png" alt="">
      <img class="glyph" src="../assets/icon-home-field.svg" alt="">
    </div>
    <p class="profileview__field-text">
      <span class="label"><span class="t-en">Address</span><span class="sp"> </span><span class="t-cn">住址：</span></span>
      <span class="value" id="addressValue">1 archer st. Chatswood</span>
    </p>
  </div>

  <div class="profileview__field" style="--y:512px">
    <div class="profileview__field-icon">
      <img class="backdrop" src="../assets/icon-field-backdrop.png" alt="">
      <img class="glyph" src="../assets/icon-phone-field.svg" alt="">
    </div>
    <p class="profileview__field-text">
      <span class="label"><span class="t-en">Phone No.</span><span class="sp"> </span><span class="t-cn">电话号码：</span></span>
      <span class="value" id="phoneValue">0445 678 901</span>
    </p>
  </div>

  <div class="profileview__field" style="--y:602px">
    <div class="profileview__field-icon">
      <img class="backdrop" src="../assets/icon-field-backdrop.png" alt="">
      <img class="glyph" src="../assets/icon-calendar.svg" alt="">
    </div>
    <p class="profileview__field-text">
      <span class="label"><span class="t-en">Birthday</span><span class="sp"> </span><span class="t-cn">生日：</span></span>
      <span class="value" id="birthdayValue">01/01/1950</span>
    </p>
  </div>

  <img class="profileview__lines" src="../assets/profile-lines.svg" alt="">

  <!-- --------------------------------------------------------------- back bar -->
  <a class="profilebar" href="home-en.html">
    <img class="profilebar__bg" src="../assets/bottomnav-bg.svg" alt="">
    <span class="crop" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
    <span class="profilebar__text">
      <span class="t-en">Back to homepage&nbsp;</span><span class="t-cn">返回首页</span>
    </span>
  </a>

</div>
</div>

<script src="../js/profile.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
</html>
