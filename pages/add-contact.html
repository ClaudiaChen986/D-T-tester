<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Adding contact 添加联系人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/add-contact.css">
</head>
<body>

<div class="stage">
<!-- ============================================================
     add contact - both  ·  390 × 844   (Figma node 120:408)
     ============================================================ -->
<div class="screen screen--add" id="screen">

  <header class="header">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="contacts.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Cancel, back to My Contact 返回">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header-title-centered">
      <span class="t-en">Adding contact</span>
      <span class="t-cn">添加联系人</span>
    </h1>
  </header>

  <form id="addForm" novalidate>

    <div class="content-bg content-bg--band"></div>
    <div class="content-bg content-bg--fill"></div>

    <label class="namefield">
      <span class="namefield__label">
        <span class="t-en">Name</span><span class="sp"> </span><span class="t-cn">名字：</span>
      </span>
      <input type="text" id="nameInput" name="name" autocomplete="off" required
             aria-label="Contact name 名字">
    </label>

    <p class="fieldlabel" style="--y:231px">
      <span class="t-en">Relationship</span><span class="sp"> </span><span class="t-cn">与您的关系：</span>
    </p>
    <input class="pillinput pillinput--wide" style="--y:267px" type="text" id="relationshipInput"
           name="relationship" autocomplete="off"
           placeholder="Enter text here 在此输入文本" aria-label="Relationship 与您的关系">

    <p class="fieldlabel" style="--y:343px">
      <span class="t-en">Phone no.</span><span class="sp"> </span><span class="t-cn">电话号码：</span>
    </p>
    <span class="phonechip" style="--y:381px" aria-hidden="true">04</span>
    <input class="pillinput pillinput--narrow" style="--y:381px" type="tel" id="phoneInput"
           name="phone" inputmode="numeric" autocomplete="off" maxlength="11"
           placeholder="Enter text here 在此输入文本"
           aria-label="Phone number, after the 04 prefix 电话号码">

    <p class="fieldlabel" style="--y:459px">
      <span class="t-en">Avatar&nbsp;</span><span class="t-cn">头像：</span>
    </p>

    <div class="avatar">
      <img class="avatar__img" id="avatarPreview" src="../assets/avatar-xl.svg" alt="">
      <button class="avatar__edit" type="button" id="choosePhotoBtn" aria-label="Choose photo 选择照片">
        <img src="../assets/edit-btn-bg.svg" alt="" class="avatar__edit-bg">
        <img src="../assets/icon-edit.svg" alt="" class="avatar__edit-icon">
      </button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
    </div>

    <p class="formstatus" role="status" aria-live="polite" id="formStatus"></p>

    <button class="save" id="saveBtn" type="submit">
      <span class="t-en">Save&nbsp;</span><span class="t-cn">保存</span>
    </button>

  </form>

</div>
</div>

<script src="../js/notifications.js"></script>
<script src="../js/add-contact.js"></script>
</body>
</html>
