<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — My Journal 我的日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/journal.css">
</head>
<body class="journal-body">

<!-- ================================================================
     My journal - both  ·  Figma node 19:1577
     A real (unbounded-height) scrolling page, like contacts.html and
     todays-events.html — entries are open-ended content, not something
     a fixed 390×844 mock scaled as one unit can hold. See js/journal.js.
     ================================================================ -->
<div class="journalpage">

  <header class="journalhead">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="other.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to Other 返回其他">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header__title">
      <span class="t-en">My Journal</span> <span class="t-cn">我的日志</span>
    </h1>

    <button type="button" class="editbtn" id="editJournalToggle" aria-pressed="false" aria-label="Edit journal entries 编辑日志">
      <img class="editbtn__icon" src="../assets/icon-edit.svg" alt="">
      <span class="editbtn__label" id="editJournalToggleLabel">
        <span class="t-en">Edit</span>
        <span class="t-cn">编辑</span>
      </span>
    </button>

    <a class="addbtn" href="add-journal.html" aria-label="Add a journal entry 添加日志">
      <span class="crop addbtn__icon" style="--x:6px;--y:2px;--w:53px;--h:53px">
        <img src="../assets/add-icon.png" alt=""
             style="--iw:248.665px;--ih:172.801px;--ix:-99.465px;--iy:-18.227px">
      </span>
      <span class="addbtn__label">
        <span class="t-en">Add</span>
        <span class="t-cn">添加</span>
      </span>
    </a>
  </header>

  <div class="journallist" id="journalList"></div>

  <a class="journalbar" href="home.html">
    <img class="journalbar__bg" src="../assets/bottomnav-bg.svg" alt="">
    <span class="crop" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
    <span class="journalbar__text">
      <span class="t-en">Back to homepage&nbsp;</span><span class="t-cn">返回首页</span>
    </span>
  </a>

</div>

<script src="../js/notifications.js"></script>
<script src="../js/journal.js"></script>
</body>
</html>
