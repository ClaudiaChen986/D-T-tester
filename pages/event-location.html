<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Location 地点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/event-location.css">
</head>
<body>

<div class="stage">
<!-- ============================================================
     event location  ·  390 × 844
     Reached from senior-events.html's Location buttons, which pass
     the destination as ?name=&address=. Map is a live Google Maps
     directions embed — see js/event-location.js.
     ============================================================ -->
<div class="screen" id="screen">

  <div class="bg-texture"><img src="../assets/background-texture.png" alt=""></div>

  <a class="crop return" href="senior-events.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to Senior event 返回老年人活动">
    <img src="../assets/return-button.png" alt=""
         style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
  </a>

  <div class="wordmark wordmark--return" aria-hidden="true">
    <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
    <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
    <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
    <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
    <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
    <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
    <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
    <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
  </div>

  <h1 class="header__title">
    <span class="t-en" id="destName">Location</span>
    <span class="t-cn">地点</span>
  </h1>

  <div class="eventloc-map">
    <iframe title="Route to event location" id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>

  <a class="eventlocbar" href="home.html">
    <img class="eventlocbar__bg" src="../assets/bottomnav-bg.svg" alt="">
    <span class="crop" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
    <span class="eventlocbar__text">
      <span class="t-en">Back to homepage&nbsp;</span><span class="t-cn">返回首页</span>
    </span>
  </a>

</div>
</div>

<script src="../js/notifications.js"></script>
<script src="../js/event-location.js"></script>
</body>
</html>
