<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Add phrase 添加短语</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/add-phrase.css">
</head>
<body>

<div class="stage">
<!-- ============================================================
     add phrase - both  ·  390 × 844
     Same template as "Set destination" (Figma node 120:387) — the
     add-destination form add-contact.html's own layout doesn't share —
     with the map image removed and its copy swapped for a phrase entry.
     ============================================================ -->
<div class="screen screen--addphrase" id="screen">

  <header class="header">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="phrase-library.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Cancel, back to Phrase library 返回">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header-title-centered">
      <span class="t-en">Add phrase</span>
      <span class="t-cn">添加短语</span>
    </h1>
  </header>

  <form id="addPhraseForm" novalidate>

    <div class="phraseform-bg phraseform-bg--band"></div>
    <div class="phraseform-bg phraseform-bg--fill"></div>

    <label class="phrasefield phrasefield--source" style="--y:153px">
      <span class="phrasefield__label">
        <span class="t-en">Chinese phrase:</span>
        <span class="t-cn">中文短语：</span>
      </span>
      <input type="text" id="cnInput" name="cn" autocomplete="off" required
             placeholder="在此输入文本 Enter text here" aria-label="Chinese phrase 中文短语">
    </label>

    <div class="phrasefield phrasefield--preview" style="--y:288px">
      <span class="phrasefield__label">
        <span class="t-en">English translation (auto):</span>
        <span class="t-cn">英语翻译（自动）：</span>
      </span>
      <textarea id="enPreview" name="en" readonly tabindex="-1" rows="1"
                placeholder="Translation preview 翻译预览" aria-label="Auto-translated English phrase 自动翻译的英语短语"></textarea>
    </div>

    <p class="formstatus" role="status" aria-live="polite" id="formStatus"></p>

    <button class="save" id="saveBtn" type="submit">
      <span class="t-en">Save&nbsp;</span><span class="t-cn">保存</span>
    </button>

  </form>

</div>
</div>

<script src="../js/add-phrase.js"></script>
</body>
</html>
