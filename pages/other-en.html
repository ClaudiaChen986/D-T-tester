<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuiTu — Other</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">

<link rel="stylesheet" href="../css/other.css">
<link rel="stylesheet" href="../css/lang-en.css">

<body data-variant="en">

<div class="stage">
<!-- ============================================================
     other - English-only  ·  390 × 844   (Figma node 142:824)
     Same markup as other.html — see lang-en.css — with its links
     pointed at the -en counterpart pages instead. Chevron --x is
     270px here too, not Figma's literal 300px (card-relative) —
     see other.html's own comment for why.
     ============================================================ -->
<div class="screen" id="screen">

  <div class="bg-texture"><img src="../assets/background-texture.png" alt=""></div>

  <!-- ---------------------------------------------------------------- header -->
  <header class="header">
    <img class="header__bg" src="../assets/header.svg" alt="">

    <a class="crop return" href="home-en.html" style="--x:9px;--y:16px;--w:93px;--h:93px" aria-label="Back to home">
      <img src="../assets/return-button.png" alt=""
           style="--iw:414.68px;--ih:288.1px;--ix:-147.91px;--iy:-160.29px">
    </a>

    <div class="wordmark wordmark--return" aria-hidden="true">
      <span style="--x:6.56px;--y:90.41px;--w:23.743px;--h:22.607px"><i style="--r:52.91deg">返</i></span>
      <span style="--x:21.43px;--y:99.65px;--w:22.019px;--h:23.744px"><i style="--r:32.94deg">回</i></span>
      <span style="--x:45.26px;--y:105.56px;--w:9.41px;--h:20.213px"><i style="--r:7.86deg">r</i></span>
      <span style="--x:54.2px;--y:105.73px;--w:8.248px;--h:19.645px"><i style="--r:-1.37deg">e</i></span>
      <span style="--x:61.59px;--y:103.79px;--w:9.849px;--h:20.261px"><i style="--r:-12.29deg">t</i></span>
      <span style="--x:66.4px;--y:100.39px;--w:15.703px;--h:21.602px"><i style="--r:-19.62deg">u</i></span>
      <span style="--x:74.37px;--y:96.07px;--w:16.24px;--h:20.063px"><i style="--r:-32.66deg">r</i></span>
      <span style="--x:79.37px;--y:89.44px;--w:20.241px;--h:20.988px"><i style="--r:-41.89deg">n</i></span>
    </div>

    <h1 class="header__title">
      <span class="t-en">Other&nbsp;</span><span class="t-cn">其他</span>
    </h1>

    <p class="header__welcome">
      <span class="t-en">Find your activity today!</span>
      <span class="t-cn">来寻找你喜欢的活动吧!</span>
    </p>
  </header>

  <!-- ---------------------------------------------------------------- menu -->
  <a class="othercard" style="--y:232px" href="todays-events-en.html">
    <img class="othercard__bg" src="../assets/other-card-bg.svg" alt="">
    <span class="crop othercard__icon" style="--x:10px;--y:19px;--s:96px">
      <img src="../assets/other-icon-badge.png" alt=""
           style="--iw:138.182px;--ih:96.029px;--ix:-20.362px;--iy:-0.01px">
    </span>
    <img class="othercard__glyph" src="../assets/other-icon-events.svg" alt=""
         style="--x:33px;--y:42px;--w:50px;--h:50px">
    <span class="chevron" style="--x:270px;--y:50px;--s:36px">
      <img src="../assets/icon-chevron.svg" alt="">
    </span>
    <span class="othercard__label" style="--x:115px;--y:22px;--w:149px">
      <span class="t-en">Today&#8217;s new events</span>
      <span class="t-cn">今日信息</span>
    </span>
  </a>

  <a class="othercard" style="--y:407px" href="calendar-en.html">
    <img class="othercard__bg" src="../assets/other-card-bg.svg" alt="">
    <span class="crop othercard__icon" style="--x:10px;--y:20px;--s:96px">
      <img src="../assets/other-icon-badge.png" alt=""
           style="--iw:138.182px;--ih:96.029px;--ix:-20.362px;--iy:-0.01px">
    </span>
    <img class="othercard__glyph" src="../assets/other-icon-calendar.svg" alt=""
         style="--x:38px;--y:46px;--w:40px;--h:44px">
    <span class="chevron" style="--x:270px;--y:50px;--s:36px">
      <img src="../assets/icon-chevron.svg" alt="">
    </span>
    <span class="othercard__label" style="--x:115px;--y:35px;--w:167px">
      <span class="t-en">My Calendar</span>
      <span class="t-cn">我的日历</span>
    </span>
  </a>

  <a class="othercard" style="--y:582px" href="journal-en.html">
    <img class="othercard__bg" src="../assets/other-card-bg.svg" alt="">
    <span class="crop othercard__icon" style="--x:6px;--y:20px;--s:96px">
      <img src="../assets/other-icon-badge.png" alt=""
           style="--iw:138.182px;--ih:96.029px;--ix:-20.362px;--iy:-0.01px">
    </span>
    <img class="othercard__glyph" src="../assets/other-icon-journal.svg" alt=""
         style="--x:32px;--y:46px;--w:44px;--h:44px">
    <span class="chevron" style="--x:270px;--y:50px;--s:36px">
      <img src="../assets/icon-chevron.svg" alt="">
    </span>
    <span class="othercard__label" style="--x:115px;--y:35px;--w:167px">
      <span class="t-en">My Journal</span>
      <span class="t-cn">我的日志</span>
    </span>
  </a>

  <!-- --------------------------------------------------------------- back bar -->
  <a class="otherbar" href="home-en.html">
    <img class="otherbar__bg" src="../assets/bottomnav-bg.svg" alt="">
    <span class="crop" style="--x:156px;--y:7px;--w:78.179px;--h:79.817px">
      <img src="../assets/logo-sprite.png" alt=""
           style="--iw:292.75px;--ih:203.45px;--ix:-110.95px;--iy:-107.65px">
    </span>
    <span class="otherbar__text">
      <span class="t-en">Back to homepage&nbsp;</span><span class="t-cn">返回首页</span>
    </span>
  </a>

</div>
</div>

<script src="../js/other.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
</html>
