<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>归途 GuiTu — Choose your language 选择你的语言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/language.css">
</head>
<body>

<div class="stage">
<!-- ============================================================
     index - language choice  ·  390 × 844   (Figma node 1:5)
     The true entry point — every session starts here, before Home.
     ============================================================ -->
<div class="screen" id="screen">

  <!-- background texture (identical asset/crop to the other screens) -->
  <div class="bg-texture"><img src="assets/background-texture.png" alt=""></div>

  <!-- ---------------------------------------------------------- header -->
  <header class="langheader">
    <img class="langheader__bg" src="assets/header-lang.svg" alt="">

    <div class="langheader__logo">
      <img src="assets/logo-sprite.png" alt="归途 GuiTu">
    </div>

    <h1 class="header-title-centered header-title-centered--lang">
      <span class="t-en">Choose your language</span>
      <span class="t-cn">选择你的语言</span>
    </h1>
  </header>

  <!-- ---------------------------------------------------------- language options
       All three crop the same icon-language.png sprite (English glyph /
       Chinese glyph / both, white-outline row) at a different column —
       see css/language.css for why the icon window itself is fixed and
       only --ix/--iy/--iw/--ih move. -->

  <a class="langbtn" href="pages/home.html?lang=cn" style="--y:312px" data-lang="cn">
    <img class="langbtn__bg" src="assets/lang-button-bg.svg" alt="">
    <span class="langbtn__icon">
      <img src="assets/icon-language.png" alt=""
           style="--ix:-126.517px;--iy:-125.276px;--iw:348.706px;--ih:242.256px">
    </span>
    <p class="langbtn__label" style="--y:51px;--w:128px">
      <span class="t-cn">只有中文</span>
    </p>
    <span class="chevron" style="--x:299.5px;--y:50px;--s:36px">
      <img src="assets/icon-chevron.svg" alt="">
    </span>
  </a>

  <a class="langbtn" href="pages/home.html?lang=both" style="--y:487px" data-lang="both">
    <img class="langbtn__bg" src="assets/lang-button-bg.svg" alt="">
    <span class="langbtn__icon">
      <img src="assets/icon-language.png" alt=""
           style="--ix:-239.019px;--iy:-128.331px;--iw:348.706px;--ih:242.256px">
    </span>
    <p class="langbtn__label" style="--y:24px;--w:166.746px">
      <span class="t-en">English &amp; Chinese</span>
      <span class="t-cn">中英双语</span>
    </p>
    <span class="chevron" style="--x:299.5px;--y:50px;--s:36px">
      <img src="assets/icon-chevron.svg" alt="">
    </span>
  </a>

  <a class="langbtn" href="pages/home.html?lang=en" style="--y:662px" data-lang="en">
    <img class="langbtn__bg" src="assets/lang-button-bg.svg" alt="">
    <span class="langbtn__icon">
      <img src="assets/icon-language.png" alt=""
           style="--ix:-8.432px;--iy:-124.328px;--iw:349.166px;--ih:242.62px">
    </span>
    <p class="langbtn__label" style="--y:53px;--w:152px">
      <span class="t-en">Only English</span>
    </p>
    <span class="chevron" style="--x:299.5px;--y:50px;--s:36px">
      <img src="assets/icon-chevron.svg" alt="">
    </span>
  </a>

</div>
</div>

<script src="js/language.js"></script>
</body>
</html>
